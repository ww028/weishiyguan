  <body>
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
      "
    >
      <h1>我观青山意难穷，</h1>
      <h1>青也惊鸿，</h1>
      <h1>颓也从容。</h1>
      <h1>春秋代序何曾改，</h1>
      <h1>荣也由风，</h1>
      <h1>枯也由风。</h1>
    </div>
  </body>
